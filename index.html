<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Expert Path">
<meta name="theme-color" content="#0a0e1a">
<title>AT&amp;T Expert Path</title>
<style>
  :root {
    --bg:#0a0e1a;--surface:#111827;--border:#1e2a40;
    --text:#e8eaf0;--muted:#8892b0;--dim:#4a5580;
    --green:#6ABF4B;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:'Helvetica Neue',Helvetica,sans-serif;min-height:100vh;overflow-x:hidden}
  #header{position:sticky;top:0;z-index:100;padding:calc(var(--safe-top) + 14px) 16px 12px;border-bottom:4px solid #FF6900;transition:background .3s}
  #header.m-install{background:linear-gradient(135deg,#00A8E0,#0055AA)}
  #header.m-repair{background:linear-gradient(135deg,#c0392b,#7b0000)}
  .eyebrow{font-size:10px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.65);text-transform:uppercase;margin-bottom:3px}
  #htitle{font-size:22px;font-weight:900;color:#fff;margin-bottom:10px;letter-spacing:.5px}
  #mode-toggle{display:flex;background:rgba(0,0,0,.3);border-radius:8px;padding:3px;margin-bottom:10px;gap:3px}
  .mbtn{flex:1;padding:8px 4px;border:none;border-radius:6px;font-size:13px;font-weight:700;cursor:pointer;color:rgba(255,255,255,.5);background:transparent;transition:all .2s}
  .mbtn.active{background:rgba(255,255,255,.18);color:#fff}
  .mbtn:active{opacity:.7}
  #pw{display:flex;align-items:center;gap:10px}
  #pbg{flex:1;height:8px;background:rgba(0,0,0,.25);border-radius:4px;overflow:hidden}
  #pfill{height:100%;width:0%;background:#fff;border-radius:4px;transition:width .4s}
  #plbl{font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
  #ppct{background:rgba(0,0,0,.25);color:#fff;font-weight:800;font-size:13px;padding:2px 8px;border-radius:4px;min-width:44px;text-align:center}
  #install-tip{margin:12px 16px 0;background:rgba(0,168,224,.12);border:1px solid rgba(0,168,224,.4);border-radius:8px;padding:10px 14px;font-size:12px;color:rgba(0,168,224,.9);line-height:1.5;text-align:center;display:none}
  .mwrap{margin:14px 16px 0}
  .mbtnm{width:100%;background:none;border:2px solid var(--border);border-radius:10px;padding:12px 14px;cursor:pointer;display:flex;align-items:center;text-align:left;color:var(--text)}
  .mbtnm:active{opacity:.8}
  .mico{width:40px;height:40px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;margin-right:12px}
  .minf{flex:1}
  .mey{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:2px}
  .mtit{font-size:18px;font-weight:900;line-height:1.1;color:#fff}
  .mmet{text-align:right;flex-shrink:0;margin-left:10px}
  .mcnt{font-size:18px;font-weight:800}
  .marr{font-size:12px;color:var(--dim);margin-top:3px}
  .slist{background:var(--surface);border:1px solid;border-top:none;border-radius:0 0 10px 10px;overflow:hidden;display:none}
  .slist.open{display:block}
  .si{border-bottom:1px solid var(--border)}
  .si:last-child{border-bottom:none}
  .si.done{background:rgba(106,191,75,.05)}
  .stop{display:flex;align-items:flex-start}
  .sca{padding:14px;cursor:pointer;flex-shrink:0}
  .cb{width:26px;height:26px;border:2px solid;border-radius:6px;display:flex;align-items:center;justify-content:center;transition:all .15s;background:transparent}
  .cb.chk{background:var(--green);border-color:var(--green)!important}
  .ck{color:#fff;font-size:15px;font-weight:900;display:none}
  .cb.chk .ck{display:block}
  .sla{flex:1;padding:14px 14px 14px 0;cursor:pointer}
  .snum{font-size:11px;font-weight:700;letter-spacing:1px;margin-bottom:2px}
  .slbl{font-size:15px;font-weight:600;line-height:1.35;color:var(--text)}
  .si.done .slbl{color:var(--muted);text-decoration:line-through}
  .sei{font-size:11px;color:var(--dim);margin-top:4px}
  .sdet{font-size:14px;line-height:1.65;color:var(--muted);padding:10px 14px 14px 54px;border-top:1px solid rgba(255,255,255,.05);display:none}
  .sdet.open{display:block}
  #cbanner{margin:16px 16px 0;background:linear-gradient(135deg,rgba(106,191,75,.2),rgba(106,191,75,.07));border:2px solid var(--green);border-radius:12px;padding:20px;text-align:center;display:none}
  #cbanner .ce{font-size:34px;margin-bottom:8px}
  #cbanner h2{font-size:24px;font-weight:900;color:var(--green);letter-spacing:1px}
  #cbanner p{font-size:13px;color:var(--muted);margin-top:6px}
  #rbtn{display:block;width:calc(100% - 32px);margin:14px 16px 0;background:transparent;border:1px solid var(--dim);color:var(--dim);font-size:12px;font-weight:600;letter-spacing:1px;text-transform:uppercase;padding:9px;border-radius:7px;cursor:pointer}
  #rbtn:active{background:rgba(255,255,255,.05)}
  #ftip{margin:14px 16px calc(var(--safe-bottom) + 16px);padding:10px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;font-size:11px;color:var(--dim);text-align:center;line-height:1.5}
</style>
</head>
<body>
<div id="header" class="m-install">
  <div class="eyebrow">AT&amp;T · Expert Path</div>
  <div id="htitle">FIBER INSTALL CHECKLIST</div>
  <div id="mode-toggle">
    <button class="mbtn active" onclick="setMode('install')">🔧 INSTALL</button>
    <button class="mbtn" onclick="setMode('repair')">🛠 REPAIR</button>
  </div>
  <div id="pw">
    <div id="pbg"><div id="pfill"></div></div>
    <div id="plbl">0 / 0</div>
    <div id="ppct">0%</div>
  </div>
</div>
<div id="install-tip">📌 <strong>Save as App:</strong> Tap Share (box+arrow) → "Add to Home Screen" → Add</div>
<div id="mc"></div>
<div id="cbanner"><div class="ce" id="ce">🎉</div><h2 id="ct">COMPLETE!</h2><p id="cm"></p></div>
<button id="rbtn" onclick="resetCurrent()">↺ Reset This Checklist</button>
<div id="ftip">Tap a step to expand instructions · Tap checkbox to mark done<br>Each checklist saves separately on your phone</div>

<script>
var D={
install:[
{id:1,title:"GREET & VERIFY",color:"#00A8E0",icon:"👋",steps:[
{l:"Make your Pre-Call",d:"Call the customer before you leave for the job. Tell them your name, confirm the appointment, tell them what service you're installing, and give them your estimated arrival time. If they don't answer, leave a voicemail with all of that info AND send a follow-up text message. This is NOT optional — you must do both if no answer."},
{l:"Update ETA in Atlas after Pre-Call",d:"Before you drive to the customer's house, open Atlas and update your ETA. Do this BEFORE you leave for the premises — not after."},
{l:"Drive directly to the customer's house first",d:"Go straight to the customer's home. Do NOT stop at the PFP or terminal first. The customer is waiting for you and first impressions matter."},
{l:"Mark On-Prem in Atlas when you arrive",d:"As soon as you pull up to the house, mark yourself On-Prem in Atlas. Do this right when you arrive, before knocking on the door."},
{l:"Meet the customer at the front door",d:"Walk up to the front door. Take off your sunglasses before you knock. Step back from the door a little so you're not right in their face when they open it. Greet them by their name, show your AT&T ID badge, and congratulate them on getting fiber service."},
{l:"Explain what's going to happen during the install",d:"Tell the customer in simple, plain language what the installation process involves and roughly how long it will take. Make them feel informed and comfortable with what's about to happen in their home."},
{l:"Tell them to download the Smart Home Manager app & register",d:"Remind the customer to download the AT&T Smart Home Manager (SHM) app on their phone right now. Pro tip: Put the QR code sticker from the BGW-320 box on the back of your ID badge so they can scan it instantly."},
{l:"Explain the Wi-Fi Assessment",d:"Let the customer know that later in the install you will walk through the home to check Wi-Fi signal strength in every room. This way it's not a surprise at the end. Tell everyone in the house now so they have time to be ready."},
{l:"Explain the 'junction box' step (copper-to-fiber customers)",d:"If this customer is switching from copper to fiber, explain that you need to briefly leave the property to make a connection at the local junction box outside. Tell them you'll be back as soon as possible to start the outside work."}
]},
{id:2,title:"QUALIFY TO TERMINAL",color:"#FF6900",icon:"🔍",steps:[
{l:"Check if job has Existing Optical Cross Connects (EOX)",d:"Look at your work order. If it's an F1 assignment with EOX already in place, you can skip the PFP step entirely and go straight to qualifying fiber at the terminal."},
{l:"For Buried Plant: Find FST and test adjacent port with VFL",d:"Locate the FST buried near the property. Clean and TRUE Test the assigned port AND a spare port next to it to verify PFP distance. If distance looks good, place VFL on the spare port only. NEVER put the VFL on the assigned customer port."},
{l:"For Aerial Plant or no spare ports: Go to the PFP",d:"If the plant is aerial (lines up on poles), or if there are no spare ports at the buried terminal, go directly to the PFP without doing the VFL test first."},
{l:"At the PFP: Verify your assignments are correct",d:"Open the PFP and confirm the port assignments match your work order. Make sure you're working on the right fiber before touching anything."},
{l:"Scope & clean the optimeter launch cable",d:"Before using your optimeter, inspect the launch cable connector under the fiber scope. Clean it if dirty. Repeat until the scope shows a clean connector face."},
{l:"Scope & clean the bulkhead and jumper — repeat until passing",d:"Use your fiber scope to look at both the bulkhead connector and the jumper connector at the PFP. Clean any dirty connectors. Keep repeating — scope, clean, scope — until you see a clean pass on all connectors."},
{l:"TRUE Test the bulkhead splitter toward the ONT",d:"Using your optimeter, perform a TRUE Test on the bulkhead in the direction toward the ONT. This confirms the fiber path is clear from the PFP onward."},
{l:"Check the light level from the splitter with optimeter",d:"Measure the optical power coming out of the splitter port. Make sure the reading is within acceptable range. If it's too weak or too strong, resolve before continuing."},
{l:"Connect the jumper — route it properly inside the PFP channels",d:"Connect the jumper to the correct port. Carefully route the jumper wire inside the designated cable channels in the PFP — neatly routed, not hanging loose or pinched."},
{l:"Write the customer's address inside the PFP",d:"Using a permanent marker, write the customer's full address inside the PFP near the jumper. This helps future techs identify which port belongs to which address."},
{l:"Check for and fix any Pulled Jumper (FPJ) SMS alerts immediately",d:"Check Atlas for any Fiber Pulled Jumper (FPJ) alerts for this PFP. Resolve them right now before moving on. Do not leave a PFP with an unresolved pulled jumper alert."},
{l:"Cap all empty/vacant ports at the PFP",d:"Any port in the PFP NOT connected to a jumper should have a dust cap on it. Find any uncapped ports and put caps on them. Dust inside an open port will contaminate the fiber."},
{l:"Verify TRUE Test and scope results are uploaded in Atlas",d:"Before leaving the PFP, open Atlas and confirm that your TRUE Test results and passing scope photos have been uploaded and saved to the job."},
{l:"At the Terminal: Prep the site and clean the FST",d:"When you get to the FST, tidy up the work area around it. Wipe down or brush off any debris from the outside of the FST before opening it."},
{l:"Clean the port at the FST with One-Click cleaner",d:"Always assume the port at the FST is dirty, even if it looks clean. Use a One-Click fiber cleaner to clean the port. You do NOT need to scope it first at this step — just clean it."},
{l:"Verify there is light on the terminal port",d:"After cleaning, use your VFL or power meter to verify there is an active optical signal (light) on the assigned port at the terminal. No light = open a CORE helper ticket."},
{l:"Geotag flowerpots and terminals in MarkIT app",d:"Use the MarkIT app to geotag (mark the GPS location of) any flowerpots and terminals you worked on. This makes them easier to find in the future."},
{l:"Repair or report non-service-affecting facility issues in MarkIT",d:"If you spot any damage at the terminal that is NOT causing the customer's service to fail, report or repair it in the MarkIT app. This is a CODE behavior — not optional."}
]},
{id:3,title:"SURVEY CUSTOMER & PREMISES",color:"#6ABF4B",icon:"🏠",steps:[
{l:"Inspect the outside of the home BEFORE going inside",d:"Walk around the outside of the home first. Look for obstacles, hazards, potential drop routing paths, where the NID should go, and how the fiber drop will travel from the street or pole to the house. Make your outside plan before stepping inside."},
{l:"Put boot covers on before entering the home",d:"Every time you go inside the customer's home, put on boot covers (shoe covers) over your work boots. This is a CODE behavior — it is required every time, no exceptions."},
{l:"Ask the customer how and where they use internet in the home",d:"Have a conversation with the customer. Ask them: Where do they watch TV? Where do they work from home? Do they game? Where is the busiest room? What devices do they have? This helps you decide where to put the gateway for the best Wi-Fi coverage."},
{l:"Survey inside wiring limitations before Wi-Fi Assessment",d:"Before walking around with the gateway to test Wi-Fi, look at any existing inside wiring. Are there walls, floors, or cables that will limit where you can run new fiber? Make note of any constraints."},
{l:"Perform Wi-Fi Assessment with a powered-up Gateway",d:"Connect the BGW gateway to power (but not to the fiber yet). Carry it through the home, room by room, and check Wi-Fi signal strength in each area. Use the Atlas Wi-Fi Assessment tool. Use simple terms — say 'signal strength' instead of 'RSSI reading.'"},
{l:"Submit Wi-Fi Assessment results in Atlas",d:"After completing the walk-through, open Atlas and press 'Submit' to save and upload the Wi-Fi Assessment results. The data does not save until you hit submit."},
{l:"Decide on best locations for Gateway, Fiber Jack, and Slack NID",d:"Using everything you learned from the customer interview, outside survey, and Wi-Fi Assessment results, pick the best locations for: (1) the Gateway, (2) the Fiber Jack, and (3) the Slack NID."},
{l:"Explain your recommended Gateway location to the customer and WHY",d:"Tell the customer where you plan to put the gateway and explain your reasoning in plain language. Customers appreciate knowing the why behind your decisions."},
{l:"Explain the proposed drop path to the customer",d:"Tell the customer exactly where the fiber wire will run from outside to inside. For buried drops, explain the route, where boring will happen, if the wire crosses driveways or hard surfaces, and how many days the wire might stay above ground before burial is complete."},
{l:"If Wi-Fi coverage is poor in areas, offer EWCS extenders now",d:"If the Wi-Fi Assessment showed weak signal in certain rooms, talk to the customer about Wi-Fi extenders (EWCS) now. Bringing it up NOW — not at the end — gives them time to think it over without feeling pressured."},
{l:"Give customer an estimated time of completion (ETC)",d:"Based on your plan, give the customer a realistic estimate of how long the full install will take. Then tell them you'll be going outside to finish the outdoor work first."},
{l:"Update ETC in Atlas",d:"After giving the customer the estimate, open Atlas and update the ETC there as well. Keep Atlas in sync with what you told the customer."}
]},
{id:4,title:"EXTEND TO HOME",color:"#F5A623",icon:"📡",steps:[
{l:"Install the Slack NID in the optimal location",d:"Mount the Slack NID at the location you decided on in Marker 3. Treat the customer's property carefully — drill cleanly, patch any unnecessary holes, and leave the mounting looking professional."},
{l:"For Buried Plant: Route and mark the BSW (Buried Service Wire)",d:"Lay the buried fiber drop wire along the planned path. Mark the route with orange flagging tape. Pro tip: put all the tape pieces on the wire at once then slide them down to the correct spacing. Follow all local hand-digging requirements and use drop guard over hard surfaces."},
{l:"For Buried Plant: Install the permanent drop, avoid bore if possible",d:"Install the final buried drop wire. Try to route it in a way that avoids boring under driveways or sidewalks if an alternate path exists. If boring is required, follow all boring procedures."},
{l:"Use Sidekick to verify drop length and scan the drop tag",d:"Use the Sidekick app to measure and verify the drop wire length. Then scan the barcode/tag on the drop wire with Sidekick to record it. This documents the exact drop that was installed."},
{l:"Tag the drop with the customer's address at the terminal",d:"Write the customer's address on a tag or label and attach it to the drop wire at the terminal end. This makes it easy for future techs to identify which drop belongs to which customer."},
{l:"For Aerial Plant: Clean drop and connect to CFST on the pole",d:"If the plant is aerial (on poles), clean the drop connector before connecting it to the CFST. After connecting, attach the drop to the pole and coil any excess wire safely at the base of the pole."},
{l:"Place connector on drop and scope & clean all connections at Slack NID",d:"Install the mechanical connector on the fiber drop wire end. Then scope and clean every connector at the Slack NID. Repeat (scope → clean → scope again) until every connection shows a clean, passing image."},
{l:"Verify light and perform TRUE Test from drop toward splitter",d:"Using your optimeter, confirm there is optical light present at the Slack NID. Then perform a TRUE Test on the drop wire toward the PFP splitter. This confirms the full outside fiber path is working before you go inside."},
{l:"Write install info inside the Slack NID",d:"Using a permanent marker, write inside the Slack NID lid: today's date, the UUID (work order number), the light level reading, and the distance from the NID to the PFP."},
{l:"Clean up ALL trash in your outside work area",d:"Before moving inside, pick up every piece of trash in your work area outside. Cable scraps, packaging, flagging tape pieces, connector wrappers — everything. Leave the yard cleaner than you found it. This is a CODE behavior."},
{l:"Update ETC in Atlas",d:"Open Atlas and update your estimated time of completion now that the outside work is done."},
{l:"Complete Sidekick/SNAP BSW Process and take required photos in Atlas",d:"In Atlas, complete the Sidekick/SNAP BSW process. Take the required photos of the buried drop installation — start point, route, and end point — and upload them in Atlas."},
{l:"Complete the BDR form in Atlas",d:"Fill out and submit the BDR (Buried Drop Record) form inside Atlas. This documents the buried drop installation officially in the AT&T system."},
{l:"Verify TRUE Test and scope results are uploaded in Atlas",d:"Before going inside, confirm in Atlas that all TRUE Test results and passing scope photos from the Slack NID are uploaded and saved."}
]},
{id:5,title:"CONNECT TO GATEWAY",color:"#9B59B6",icon:"🔌",steps:[
{l:"Put boot covers on before entering the home",d:"Every time you re-enter the home, put on fresh boot covers. This is required every entry — no exceptions."},
{l:"Run pre-connectorized bend-insensitive Inside Wire (IW) to Fiber Jack location",d:"Route the pre-made fiber inside wire (IW) from the Slack NID entry point through the home to where you are mounting the Fiber Jack. Use the pre-connectorized, bend-insensitive fiber IW — not regular drop wire. Be extremely careful: avoid stapling through the fiber, bending it sharply, or pinching it."},
{l:"Seal all drilled holes with B-Sealant",d:"Every hole you drill through an exterior wall must be sealed with B-Sealant (foam sealant / fire block). Apply it around the wire inside the hole to block air, pests, and moisture. Do not leave drilled holes open."},
{l:"Install the Fiber Jack safely and neatly",d:"Mount the Fiber Jack at the predetermined location. No tripping hazards, no sharp bends on the fiber. Mount the faceplate flush and level on the wall. Treat the customer's property as if it were your own home."},
{l:"Give the customer periodic ETC updates while working inside",d:"Keep the customer informed while you're working inside their home. Give them quick updates on your progress and when you expect to be done. This is a CODE behavior."},
{l:"Scope & clean all connections at the Fiber Jack — repeat until passing",d:"Once the Fiber Jack is mounted, scope every connector at the Fiber Jack. Clean any dirty connectors and scope again. Repeat until you have a clean pass on every connection. Do not skip this."},
{l:"Upload a passing Fiber Jack photo via Sidekick in Atlas",d:"Use the Sidekick feature in Atlas to take a clear photo of the completed Fiber Jack installation. Upload it to Atlas. This is required."},
{l:"Scope & clean the optimeter launch cable",d:"Before doing the final TRUE Test, scope and clean your optimeter launch cable again. A dirty launch cable will cause a failing test that isn't real."},
{l:"Perform final TRUE Test from shuttered ONT jumper toward splitter",d:"Connect your optimeter to the shuttered ONT jumper (the one that will plug into the gateway's SFP port) and perform a TRUE Test toward the PFP splitter. This is the final end-to-end fiber quality test."},
{l:"Upload the final TRUE Test results in Atlas",d:"In Atlas, upload the final passing TRUE Test result. This is required before you can complete the job."},
{l:"Verify the correct SFP is in the gateway",d:"Check the SFP module in the BGW gateway. Make sure it is the correct SFP type for this circuit. Using the wrong SFP will cause activation to fail."},
{l:"Scope and clean the SFP port (if needed)",d:"Inspect the SFP port on the gateway. If it appears dirty or has been sitting open, clean it. NOTE: If you are using a BGW 620 on XGS-PON wavelength, the internal SFP cannot be scoped — that is normal and already accounted for in Expert Quest."},
{l:"Power on gateway — wait for FLASHING RED before connecting fiber",d:"Plug the gateway into power. Wait for the LED on the front to start FLASHING RED before you connect the shuttered fiber jumper to the SFP. Connecting the fiber before the flashing red LED can cause a firmware issue that prevents activation."},
{l:"Connect the shuttered jumper to the SFP",d:"Once the gateway is flashing RED, scope and clean the shuttered jumper one final time if needed, then plug it into the SFP port on the gateway."},
{l:"Activate the ONT Gateway through Atlas or LSBBT",d:"Open Atlas or LSBBT and complete the ONT gateway activation steps. Follow the on-screen prompts. Wait for it to complete and confirm the gateway comes online."},
{l:"Validate customer registration via Quality Check in LSBBT",d:"In LSBBT, run the Quality Check and confirm that the customer's registration is showing as completed. If you get error RR78, help or instruct the customer to open their Smart Home Manager app and register their internet service from there."},
{l:"Verify the customer has internet — actually test it",d:"Pick up a device and confirm it connects to the internet and can browse websites. Do not assume it's working just because the gateway has a green light."}
]},
{id:6,title:"FINALIZE EXPERIENCE",color:"#E74C3C",icon:"📱",steps:[
{l:"If extenders are needed: place and validate them now",d:"If the Wi-Fi Assessment showed areas with poor coverage and the customer agreed to extenders, place them in the identified locations. Confirm each one connects to the gateway and shows a strong signal. Do NOT separate the 2.4 GHz and 5 GHz bands — leave band steering on."},
{l:"Ask if customer wants to use their old Wi-Fi name and password",d:"Ask the customer if they'd like to keep using their old Wi-Fi network name (SSID) and password. If yes, set the new gateway to match their old router so all their devices reconnect automatically."},
{l:"Confirm the customer is logged into Smart Home Manager (SHM)",d:"Verify the customer can open the Smart Home Manager app on their phone and is logged in. If they haven't registered yet, guide them through it without touching their device."},
{l:"Show customer how to view their Wi-Fi settings in SHM",d:"In SHM, have the customer tap 'My Wi-Fi' in the left corner. Show them where they can see connected devices, rename their network, and change their password."},
{l:"Have the customer run a speed test in SHM",d:"In SHM, have the customer tap the network icon at the bottom, select Speed Test, then press the play button. Walk through the results with them using simple terms."},
{l:"Show customer the virtual assistant/help feature in SHM",d:"Show the customer how to find the Virtual Assistant in SHM by tapping the Message Center icon in the upper right corner. This is where they can get self-help for common issues without calling AT&T."},
{l:"Turn on push notifications in SHM",d:"Have the customer tap the Profile icon in SHM, go to SHM App Preferences, and make sure push notifications are turned ON. This lets AT&T alert them automatically if there's an outage or service issue."},
{l:"Explain Internet Backup",d:"Let eligible customers know about Internet Backup — if their fiber goes down, the gateway can use their AT&T wireless (cell phone) service as a backup to keep them connected."},
{l:"Confirm ActiveArmor is activated and explain it",d:"In SHM, have the customer tap the Profile icon, then confirm ActiveArmor is activated. Explain that ActiveArmor is a FREE security feature that automatically blocks malicious websites and protects all devices on their network."},
{l:"Run Quality Check in Atlas and address Wi-Fi recommendations",d:"Open Atlas and run the Quality Check for this job. Review any Wi-Fi recommendations it gives you and address each one. Don't skip past them."},
{l:"Make sure all the customer's devices are connected and working",d:"Before you leave, ask the customer to check their main devices — TVs, computers, phones, tablets, smart speakers. Make sure each one is connected to the Wi-Fi. Help fix anything that won't connect before you leave."}
]},
{id:7,title:"VERIFY, THANK & CLOSE",color:"#1ABC9C",icon:"✅",steps:[
{l:"Resolve any remaining customer concerns",d:"Ask the customer one final time if there's anything they're unsure about, anything that isn't working right, or any question they have. Fully resolve any issue before closing out the job."},
{l:"Send a text to the customer before leaving",d:"While still at the premises, send a text message to the customer confirming their service is working and asking if they have any final questions. This catches any last-minute issues before you drive away."},
{l:"Offer to show the customer the drop routing and Slack NID placement",d:"Ask if the customer wants a quick tour of the outside work. Walk them to the Slack NID and show them where it's mounted. For buried drops, explain the route, where boring was done, if it crossed hard surfaces, and how many days the wire might be above ground before burial."},
{l:"Explain the AT&T Guarantee",d:"Let the customer know about the AT&T Guarantee — AT&T guarantees the service and the installation. If they have any issues related to the install, AT&T will come back and make it right."},
{l:"Thank the customer sincerely",d:"Look the customer in the eye and genuinely thank them by name for their time and for choosing AT&T. Make it personal — not a robot speech. Leave them feeling great about the experience."},
{l:"Complete Final Quality Check in Atlas",d:"Open Atlas and run the final Quality Check for the job. Review every item. Make sure everything is green before you close."},
{l:"Confirm Final TRUE Test is uploaded in Atlas",d:"Verify that the final TRUE Test result is uploaded and showing in Atlas. This must be present before you can close the job."},
{l:"Confirm Final Gateway Speed Test is done and uploaded",d:"Make sure the final gateway speed test results are uploaded in Atlas. This documents that the service is delivering the correct speeds at completion."},
{l:"Complete Final ETC in Atlas",d:"Enter the final actual completion time in Atlas. This closes out the time tracking for the job."},
{l:"Close the job in Atlas FROM the customer's premises",d:"Close the job in Atlas while you are still physically at or in front of the customer's property — not from your truck down the street, and not from your next job. The job must be closed on-prem."},
{l:"Place Fiber Door Hangers on neighboring homes (Pro Tip)",d:"Optional but encouraged: Before you drive away, leave AT&T Fiber door hangers on neighboring houses. You just installed fiber on this street — the neighbors may be interested. Also a great time to mention AT&T wireless referrals."}
]}
],
repair:[
{id:1,title:"DISPATCH, PREVIEW & CONTACT",color:"#E74C3C",icon:"📋",steps:[
{l:"Accept and review the dispatch in Atlas",d:"When the repair ticket is dispatched to you, open Atlas and pull up the job. Read everything on the ticket before you do anything else. This gives you a picture of what you're walking into."},
{l:"Review the agent comments and trouble reported",d:"In Atlas, read through any notes that the customer service agent left when the customer called in. This tells you what the customer complained about and what was already tried. The customer's own words about the problem are valuable clues."},
{l:"Review the job history",d:"In Atlas, look at the history tab for this customer. Check if there have been previous repair tickets at this address, what the problems were, and how they were resolved. If this customer has called in several times for the same issue, that is important information that changes how you approach the repair."},
{l:"Review equipment info in Atlas",d:"In Atlas, look at what equipment this customer has — what gateway model, what SFP, what speed tier they're subscribed to. Knowing this before you arrive means you can bring the right replacement equipment in your truck."},
{l:"Review Quality Check results in Atlas",d:"In Atlas, pull up the Quality Check results for this customer. Look at what the system is showing — are there any active RR codes (error codes)? Any failing tests? Any alerts? This gives you a virtual diagnosis before you even leave your truck."},
{l:"Check for RR codes 134, 135, or 136 — Internet Backup related",d:"If you see RR codes 134, 135, or 136 in Atlas, those are specifically related to Internet Backup. Make a note of these because you will need to address them as soon as you arrive at the customer's home."},
{l:"Make your Pre-Call to the customer",d:"Call the customer before you leave for the job. Introduce yourself by name. Confirm you're calling about their repair appointment. Ask them what's going on with their service — let them tell you in their own words. Verify their address and ask about any access issues (gate codes, dogs, parking restrictions, etc.). Give them your ETA. If they don't answer, leave a voicemail AND send a text message. Both are required if there is no answer."},
{l:"Update ETA in Atlas after the Pre-Call",d:"After finishing the pre-call (or leaving the voicemail), open Atlas and update your ETA before you start driving. Do this before you leave — not when you arrive."},
{l:"Drive directly to the customer's premises",d:"Go straight to the customer's home. Do not stop at the PFP, terminal, or anywhere else first. Hold all further analysis until you have met with the customer in person. Doing outside work before talking to the customer is not permitted."}
]},
{id:2,title:"GREET & UNDERSTAND",color:"#FF6900",icon:"🤝",steps:[
{l:"Mark On-Prem in Atlas when you arrive",d:"As soon as you pull up to the customer's home, open Atlas and mark yourself On-Prem. Do this before you get out of the truck."},
{l:"Grab your tools and go directly to the door",d:"Bring your appropriate tools with you to the front door right away. Based on what you learned from the pre-call and Atlas review, have a sense of what tools you might need first."},
{l:"Take off sunglasses and step back from the door",d:"Before you knock or ring the doorbell, take off your sunglasses. Step back a bit from the door so you're not right in the customer's face when they open it. This shows respect and makes a better first impression."},
{l:"Greet the customer by name and show your AT&T ID",d:"When the customer opens the door, greet them by name (check your work order). Show them your AT&T employee ID badge so they know you are who you say you are. Do this every time."},
{l:"Put on boot covers before entering the home",d:"Every single time you enter the customer's home, put on boot covers (shoe covers) over your work boots. This is a CODE behavior — it is required every time, without exception, even if you're only going in for 30 seconds."},
{l:"Actively listen to the customer — let them explain the problem in full",d:"Once inside, let the customer talk. Do not interrupt or jump to conclusions. Ask them to show you what's happening and describe when it started. Ask follow-up questions to fully understand the problem. Use soft skills — be patient, empathetic, and professional. Never blame other AT&T employees or make the customer feel like the problem is their fault."},
{l:"Ask the customer to show you where the gateway is located",d:"Have the customer walk you to the gateway (the router box). This gives you a chance to see the physical setup, check for obvious issues, and continue the conversation while you're moving through the home."},
{l:"Discuss Internet Backup with the customer (if eligible)",d:"If the customer is eligible for Internet Backup (the feature that uses their AT&T cell service as a backup when fiber goes down), bring it up now. Ask them if they know about it and if it's enabled. If RR codes 134, 135, or 136 were showing in Atlas, address those specifically."},
{l:"Discuss and get approval for any billable items BEFORE doing the work",d:"If any work you need to do might result in a charge to the customer, you must discuss this and get their approval BEFORE you do the work. Do not surprise them with a charge after the fact. This is required."},
{l:"Make note of any quality defects you see inside or outside the home",d:"While walking through the home and outside, look for quality problems: missing Slack NID, drop wire being used as inside wire instead of proper fiber IW, external ONT or old RG that should be upgraded to BGW-320, missing Fiber Jack, or any other defect listed in the quality handbook. You will address these during the repair."},
{l:"Determine if service is Out of Service or In-Service — then go to the right Marker",d:"Based on your conversation and initial look at the gateway, determine the service condition. If the customer has NO internet at all (Out of Service) — start at Marker 3A Network. If the customer HAS internet but it's slow, dropping, or having Wi-Fi issues (In-Service) — start at Marker 3B Home."}
]},
{id:3,title:"ISOLATE & RESOLVE — 3A NETWORK",color:"#9B59B6",icon:"🔬",steps:[
{l:"Determine your starting point for the TRUE Test",d:"Look at the type of problem. If the drop wire is cut or physically damaged, start your testing at the CFST (connection point on the pole or at the terminal outside) — clean the connector only, do not scope it. For all other Out of Service issues, start at the back of the gateway (RG/ONT port) and work outward from there."},
{l:"For damaged drop: Use Sidekick to verify drop length and scan the tag",d:"If the drop wire is damaged and needs to be replaced, use the Sidekick app to measure the length of the new drop and scan its tag/barcode. This documents the replacement drop in the system."},
{l:"Scope and clean the optimeter launch cable",d:"Before you start TRUE Testing, scope your optimeter launch cable and clean it if needed. A dirty launch cable gives you false test results. Repeat until the scope shows a clean connector face."},
{l:"Run a Neighborhood Check by PON/FST for Out of Service conditions",d:"For any Out of Service repair, run a Neighborhood Check in Atlas/LSBBT using the PON or FST identifier. This tells you if other customers on the same fiber splitter are also out. If multiple customers are out at once, the problem is almost certainly in the network and a CORE helper ticket is likely needed."},
{l:"Perform TRUE Test toward PFP — repeat scope and clean until passing",d:"Using your optimeter, perform a TRUE Test starting at the back of the gateway or at the CFST and testing toward the PFP. If the test fails, look at the distance reading on the TRUE Test — it tells you approximately how far from your test point the problem is located."},
{l:"Tell the customer you need to briefly leave the premises if going outside",d:"Before you step outside to work on the drop, terminal, or PFP, tell the customer you need to go outside for a few minutes and that you will be back. Don't just disappear without telling them what's happening."},
{l:"Use VFL at gateway to trace fiber strand through network if needed",d:"If you're having trouble locating a fault or need to verify which fiber is which, connect a VFL (Visual Fault Locator — the red light device) to the fiber at the gateway end and use the red light to trace and identify the fiber strand through the network."},
{l:"Review the label inside the Slack NID door",d:"When you open the Slack NID, look at any labels written on the inside of the door. A previous technician should have written the date of install, work order number, light level, and distance to PFP. This information helps you understand the baseline condition of the circuit."},
{l:"Repair all identified faults",d:"Once you've located the problem (dirty connector, damaged fiber, pulled jumper, bad splice, no light at terminal, etc.), repair it. This may involve cleaning connectors, replacing a section of drop wire, reconnecting a jumper at the PFP, or opening a CORE helper ticket if the problem is in the network beyond your reach."},
{l:"Clean up all trash in your work area",d:"Every time you finish working in an area — outside at the terminal, at the PFP, at the Slack NID — pick up every piece of trash you generated. Leave it cleaner than you found it. This is a CODE behavior."},
{l:"Repeat TRUE Test and repair steps until you get a passing TRUE result",d:"After making a repair, perform the TRUE Test again. If it still fails, analyze the new results and make another repair. Keep repeating this loop (TRUE Test → identify fault → repair → TRUE Test again) until you achieve a clean passing TRUE Test result."},
{l:"If unable to resolve: submit a helper ticket immediately and explain to customer",d:"If you have done everything you can and still cannot get a passing TRUE Test, submit a CORE helper ticket right away. The sooner you submit it, the better the chance the CORE tech can get there the same day. After submitting, tell the customer in simple terms: 'There is a problem in the fiber network that requires a specialist. I've already submitted a request for them to come out and given them all the information they need.'"},
{l:"Address quality defects — install missing Slack NID if needed",d:"If you noted during the walk-through that there is no Slack NID installed, install one now. This is required as part of the repair — not optional."},
{l:"Address quality defects — replace drop-fed IW with proper Fiber IW",d:"If the inside wire running from the Slack NID to the Fiber Jack is the drop wire (outdoor fiber) instead of the proper bend-insensitive inside fiber wire, replace it now with the correct pre-connectorized fiber IW."},
{l:"Address quality defects — replace external ONT or old RG with BGW-320",d:"If the customer still has an external ONT (the older white box separate from the router) or an older gateway model, replace it with the current BGW-320 gateway. This is an upgrade the customer deserves as an existing customer."},
{l:"Address quality defects — install missing Fiber Jack if needed",d:"If there is no Fiber Jack installed (the small wall outlet where the fiber wire plugs into the inside wall), install one now as part of the quality repair process."},
{l:"Upload passing TRUE Test and scope results from RG/ONT in Atlas",d:"Once you have a passing TRUE Test result, open Atlas and upload the TRUE Test results and passing scope photos from the RG/ONT (gateway) end. This is required before you can complete the job."},
{l:"Upload passing Fiber Jack photo in Atlas",d:"Take a clear photo of the Fiber Jack installation using the Sidekick feature in Atlas and upload it. Required whether you installed a new one or confirmed the existing one is in good condition."},
{l:"Give the customer periodic ETC updates throughout the repair",d:"Keep the customer informed throughout the entire repair process. Any time you finish a phase of the repair or the estimate changes, give the customer a quick update. They should never feel like they're being left in the dark."}
]},
{id:4,title:"ISOLATE & RESOLVE — 3B HOME",color:"#F5A623",icon:"📶",steps:[
{l:"Put on boot covers before entering the home",d:"Every time you enter the customer's home, put on boot covers over your work boots. Required every entry — no exceptions."},
{l:"Run the full remote suite of tests in LSBBT to isolate the issue",d:"Open LSBBT and run the full suite of remote diagnostic tests: Realtime LPA, Neighborhood Check, 73xx Historical Trending, Quality Check, and Radius. Run all of them. These tests give you a complete picture of the health of the customer's circuit. If these tests indicate a fiber network problem, stop home troubleshooting and go to Marker 3A — Network."},
{l:"Establish a clean, passing fiber network BEFORE troubleshooting the home",d:"Do not start troubleshooting Wi-Fi, gateway settings, or connected devices until you have confirmed the fiber network side is working correctly. A clean TRUE Test and passing QC on the network side must be established first."},
{l:"Focus on RR codes in Atlas to direct your troubleshooting path",d:"In Atlas, look at the active RR codes (result reason codes) for this customer. Each RR code points to a specific type of problem and tells you what to check. Follow the guidance for each active RR code before moving on to general troubleshooting."},
{l:"Perform an Atlas Wi-Fi Assessment",d:"Use the Atlas Wi-Fi Assessment tool to check Wi-Fi signal strength throughout the customer's home. Carry the assessment device through each room and check the signal. This gives you data on where Wi-Fi is strong and where it's weak."},
{l:"Correct issues based on QC Recommended Actions and LSBBT/Wi-Fi test results",d:"After reviewing all the test results, follow the recommended actions. The Quality Check in LSBBT will suggest specific fixes based on what it finds. Work through each recommended action one at a time."},
{l:"Run TRUE Test again and confirm it passes — if it fails, go to 3A Network",d:"After making adjustments on the home side, run the TRUE Test again from the gateway end. If it passes, you're good to continue. If the TRUE Test fails at this point, stop home troubleshooting and go to Marker 3A to address the network issue."},
{l:"If breaking open any fiber connections: scope and clean before reconnecting",d:"Any time you disconnect a fiber connector anywhere in the home (at the Fiber Jack, at the gateway, at the Slack NID) to inspect or replace it, you must scope and clean both connector ends before reconnecting them. Every single time — no exceptions."},
{l:"Update ETC in Atlas",d:"Update your estimated time of completion in Atlas anytime your estimate changes. Keep Atlas current throughout the repair process."},
{l:"Address quality defects — install missing Slack NID if needed",d:"If you noted during the walk-through that there is no Slack NID installed, install one now. This is required as part of the repair process — not optional."},
{l:"Address quality defects — replace drop-fed IW with proper Fiber IW",d:"If the inside wire running to the Fiber Jack is the outdoor drop wire instead of the proper bend-insensitive fiber IW, replace it now with the correct pre-connectorized fiber IW."},
{l:"Address quality defects — replace external ONT or old RG with BGW-320",d:"If the customer still has an external ONT or older gateway model, replace it with the current BGW-320 now. Our existing customers deserve the same upgraded equipment as new customers."},
{l:"Address quality defects — install missing Fiber Jack if needed",d:"If there is no Fiber Jack (the small wall outlet where fiber plugs in), install one now as part of the quality repair."},
{l:"Upload passing TRUE Test and scope results from RG/ONT in Atlas",d:"Once you have a passing TRUE Test result, open Atlas and upload the TRUE Test results and passing scope photos from the gateway end. This is required before closing the job."}
]},
{id:5,title:"VALIDATE, EDUCATE & CLOSE",color:"#1ABC9C",icon:"✅",steps:[
{l:"Confirm the repair resolved the customer's original issue",d:"Before you do anything else in this final marker, verify that the specific problem the customer called in about is actually fixed. Test it yourself — don't just assume it works because the gateway has a green light. If it was a Wi-Fi issue in the bedroom, go to the bedroom and test it. If it was a speed issue, run a speed test. Confirm the fix is real."},
{l:"Run a final Quality Check in Atlas and confirm passing results",d:"Open Atlas and run the final Quality Check for this job. Every item should be passing. If anything is still showing as a problem, address it before moving on. Do not close a job with a failing Quality Check."},
{l:"Run a final TRUE Test and confirm it passes",d:"Perform one final TRUE Test from the gateway end and confirm it passes. Upload the results in Atlas. This is the final documentation that the fiber circuit is in good, clean condition."},
{l:"Perform a final gateway speed test and confirm speeds are correct",d:"Run a speed test on the gateway and verify the customer is receiving speeds consistent with what they are paying for. If speeds are significantly lower than expected, troubleshoot before closing. Upload the speed test results in Atlas."},
{l:"Look for futureproofing opportunities to improve the customer's setup",d:"Take a final look at the customer's overall setup. Are there any improvements you could make quickly that would benefit them in the future? Could extenders improve their Wi-Fi? Would upgrading a piece of equipment improve their experience? If an improvement would take too long, note it and discuss with your manager — but don't overlook easy wins."},
{l:"Educate the customer on the Smart Home Manager (SHM) app",d:"Take a few minutes to show the customer the SHM app on their phone. Show them how to check their connected devices, run a speed test, use the Virtual Assistant for self-help, and enable push notifications. This empowers them to monitor and manage their own service, which reduces future repair calls for simple issues."},
{l:"Confirm ActiveArmor is activated",d:"In SHM, have the customer tap the Profile icon and confirm that ActiveArmor is turned on. Explain that it's a free security feature that blocks malicious websites for all devices on the network. Let them know about the paid ActiveArmor Advanced upgrade if they want more protection."},
{l:"Explain Internet Backup to the customer (if eligible)",d:"If the customer is eligible for Internet Backup, explain it now if you haven't already: if their fiber ever goes down again, the gateway can automatically switch to using their AT&T wireless cell service as a backup so they stay connected."},
{l:"Resolve any remaining customer concerns",d:"Ask the customer directly: 'Is there anything else about your service that you're concerned about or that isn't working the way you expect?' Take the time to address anything they bring up. Do not rush past this step."},
{l:"Send the customer a text before leaving to confirm everything is good",d:"While still at the premises, send a text message to the customer. Tell them you're wrapping up, confirm their service is working, and ask if they have any final questions. This catches any last-minute issues before you drive away."},
{l:"Thank the customer sincerely",d:"Look the customer in the eye and genuinely thank them by name for their patience during the repair and for being an AT&T customer. Be sincere — not scripted. Leave them feeling like AT&T cares about them."},
{l:"Complete Final ETC in Atlas",d:"Enter the final actual completion time in Atlas. This closes out the time tracking for the job."},
{l:"Close the job in Atlas FROM the customer's premises",d:"Close the repair job in Atlas while you are still physically at or in front of the customer's property. The job must be closed on-prem."}
]}
]};

// ── State ─────────────────────────────────────────────
var IK='att_ep_i2', RK='att_ep_r2', MK='att_ep_mode';
var mode=localStorage.getItem(MK)||'install';
var IS={}, RS={};
function loadS(){try{IS=JSON.parse(localStorage.getItem(IK)||'{}')}catch(e){IS={}}try{RS=JSON.parse(localStorage.getItem(RK)||'{}')}catch(e){RS={}}}
function saveS(){try{localStorage.setItem(IK,JSON.stringify(IS));localStorage.setItem(RK,JSON.stringify(RS));localStorage.setItem(MK,mode)}catch(e){}}
function gs(){return mode==='install'?IS:RS}
function gm(){return D[mode]}
function tot(){return gm().reduce(function(s,m){return s+m.steps.length},0)}
function done(){return Object.values(gs()).filter(Boolean).length}

function upProg(){
  var d=done(),t=tot(),p=t?Math.round(d/t*100):0;
  document.getElementById('pfill').style.width=p+'%';
  document.getElementById('pfill').style.background=p===100?'#6ABF4B':'#fff';
  document.getElementById('plbl').textContent=d+' / '+t;
  document.getElementById('ppct').textContent=p+'%';
  document.getElementById('ppct').style.background=p===100?'#6ABF4B':'rgba(0,0,0,.25)';
  var b=document.getElementById('cbanner');
  b.style.display=p===100?'block':'none';
  if(p===100){
    document.getElementById('ce').textContent=mode==='install'?'🎉':'💪';
    document.getElementById('ct').textContent=mode==='install'?'INSTALL COMPLETE!':'REPAIR COMPLETE!';
    document.getElementById('cm').textContent=mode==='install'?'You just installed the best broadband product in America.':'Another customer back in service. Great work!';
  }
}
function upMC(mId){
  var markers=gm(),marker=markers.find(function(m){return m.id===mId});
  if(!marker)return;
  var st=gs(),d=marker.steps.filter(function(s,i){return st[mId+'-'+i]}).length;
  var el=document.querySelector('[data-mc="'+mId+'"]');
  if(el){el.textContent=d+'/'+marker.steps.length;el.style.color=d===marker.steps.length?'#6ABF4B':marker.color}
  var btn=document.querySelector('[data-mb="'+mId+'"]');
  if(btn)btn.style.borderColor=d===marker.steps.length?marker.color:marker.color+'88';
}

function tchk(mId,i){
  var key=mId+'-'+i,st=gs();
  st[key]=!st[key];saveS();
  var cb=document.querySelector('[data-cb="'+mId+'-'+i+'"]');
  var row=document.querySelector('[data-row="'+mId+'-'+i+'"]');
  if(cb)cb.classList.toggle('chk',!!st[key]);
  if(row)row.classList.toggle('done',!!st[key]);
  upMC(mId);upProg();
}
function tdet(mId,i){
  var el=document.querySelector('[data-det="'+mId+'-'+i+'"]');
  if(!el)return;
  var open=el.classList.toggle('open');
  var ic=document.querySelector('[data-ic="'+mId+'-'+i+'"]');
  if(ic)ic.textContent=open?'▲':'▼';
}
function tmkr(mId){
  var list=document.querySelector('[data-lst="'+mId+'"]');
  var arr=document.querySelector('[data-arr="'+mId+'"]');
  if(!list)return;
  var open=list.classList.toggle('open');
  if(arr)arr.textContent=open?'▲':'▼';
}

function setMode(m){
  mode=m;saveS();
  document.getElementById('header').className=m==='install'?'m-install':'m-repair';
  document.getElementById('htitle').textContent=m==='install'?'FIBER INSTALL CHECKLIST':'FIBER REPAIR CHECKLIST';
  document.querySelectorAll('.mbtn').forEach(function(b,i){b.classList.toggle('active',(m==='install'&&i===0)||(m==='repair'&&i===1))});
  render();
}

function resetCurrent(){
  if(!confirm('Reset all checkboxes for the '+mode+' checklist? This cannot be undone.'))return;
  if(mode==='install')IS={};else RS={};
  saveS();render();
}

function render(){
  var markers=gm(),st=gs(),html='';
  markers.forEach(function(marker){
    var mId=marker.id;
    var d=marker.steps.filter(function(s,i){return st[mId+'-'+i]}).length;
    var comp=d===marker.steps.length;
    html+='<div class="mwrap"><button class="mbtnm" data-mb="'+mId+'" style="border-color:'+(comp?marker.color:marker.color+'88')+';background:linear-gradient(135deg,'+marker.color+'22,'+marker.color+'10)" onclick="tmkr('+mId+')">';
    html+='<div class="mico" style="background:'+marker.color+'">'+marker.icon+'</div>';
    html+='<div class="minf"><div class="mey" style="color:'+marker.color+'">Marker '+mId+(comp?' &nbsp;✓':'')+'</div><div class="mtit">'+marker.title+'</div></div>';
    html+='<div class="mmet"><div class="mcnt" data-mc="'+mId+'" style="color:'+(comp?'#6ABF4B':marker.color)+'">'+d+'/'+marker.steps.length+'</div><div class="marr" data-arr="'+mId+'">▼</div></div>';
    html+='</button><div class="slist'+(mId===1?' open':'')+'" data-lst="'+mId+'" style="border-color:'+marker.color+'44">';
    marker.steps.forEach(function(step,i){
      var checked=!!st[mId+'-'+i];
      html+='<div class="si'+(checked?' done':'')+'" data-row="'+mId+'-'+i+'">';
      html+='<div class="stop"><div class="sca" onclick="tchk('+mId+','+i+')">';
      html+='<div class="cb'+(checked?' chk':'')+'" data-cb="'+mId+'-'+i+'" style="border-color:'+(checked?'#6ABF4B':marker.color+'88')+'"><span class="ck">✓</span></div>';
      html+='</div><div class="sla" onclick="tdet('+mId+','+i+')">';
      html+='<div class="snum" style="color:'+marker.color+'">'+mId+'.'+(i+1)+'</div>';
      html+='<div class="slbl">'+step.l+'</div>';
      html+='<div class="sei" data-ic="'+mId+'-'+i+'">▼</div>';
      html+='</div></div>';
      html+='<div class="sdet" data-det="'+mId+'-'+i+'">'+step.d+'</div>';
      html+='</div>';
    });
    html+='</div></div>';
  });
  document.getElementById('mc').innerHTML=html;
  upProg();
  markers.forEach(function(m){upMC(m.id)});
  // open first marker
  var lst=document.querySelector('[data-lst="1"]');
  var arr=document.querySelector('[data-arr="1"]');
  if(lst)lst.classList.add('open');
  if(arr)arr.textContent='▲';
}

loadS();
render();
if(!window.navigator.standalone)document.getElementById('install-tip').style.display='block';
</script>
</body>
</html>
